<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Demand forecast line chart with confidence band"><title>Demand forecast line chart with confidence band</title><desc>Vector illustration of a rising demand forecast with an uncertainty band.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A2350"/><stop offset="1" stop-color="#0E3F86"/></linearGradient><linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#19B5D6" stop-opacity="0"/><stop offset=".5" stop-color="#19B5D6" stop-opacity=".9"/><stop offset="1" stop-color="#19B5D6" stop-opacity="0"/></linearGradient></defs><rect width="400" height="240" fill="url(#bg)"/><polyline points="30,180 80,150 130,160 180,110 230,125 280,80 330,60" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="12"/><polyline points="30,180 80,150 130,160 180,110 230,125 280,80 330,60" fill="none" stroke="#19B5D6" stroke-width="4"/><circle cx="30" cy="180" r="5" fill="#fff"/><circle cx="80" cy="150" r="5" fill="#fff"/><circle cx="130" cy="160" r="5" fill="#fff"/><circle cx="180" cy="110" r="5" fill="#fff"/><circle cx="230" cy="125" r="5" fill="#fff"/><circle cx="280" cy="80" r="5" fill="#fff"/><circle cx="330" cy="60" r="5" fill="#fff"/><path d="M230 125 L280 80 L330 60 L330 100 L280 120 Z" fill="#19B5D6" fill-opacity=".25"/><line x1="20" y1="205" x2="380" y2="205" stroke="#fff" stroke-opacity=".6"/></svg>